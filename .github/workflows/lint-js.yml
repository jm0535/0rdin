name: JS Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-js:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    # No npm install needed: tools/lint-js.mjs is dependency-free
    # (checks UTF-8 encoding + syntax of every JS file in the repo).
    - name: Run Lint
      run: npm run lint
